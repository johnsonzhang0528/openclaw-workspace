# 監控儀表板配置

dashboard:
  # 儀表板更新間隔（秒）
  refresh_interval: 30
  
  # 最大顯示任務數量
  max_tasks: 20
  
  # 歷史記錄保留天數
  history_days: 7
  
  # 最大警報數量
  max_alerts: 100
  
  # 預設顯示模式
  default_mode: "compact"  # compact, detailed, chart

monitoring:
  # CPU 使用率閾值（百分比）
  cpu_threshold: 80
  
  # 記憶體使用率閾值（百分比）
  memory_threshold: 90
  
  # 任務超時時間（分鐘）
  timeout_minutes: 60
  
  # 資源檢查間隔（秒）
  check_interval: 5

alerts:
  # 啟用警報系統
  enabled: true
  
  # 警報等級配置
  levels:
    info:
      enabled: true
    warning:
      enabled: true
      threshold: 80
    critical:
      enabled: true
      threshold: 95

telegram:
  # Telegram 整合配置
  enabled: true
  
  # 按鈕配置
  buttons:
    compact: "📊 精簡"
    detailed: "📋 詳細"
    chart: "📈 圖表"
    refresh: "🔄 刷新"
    pause: "⏸️  暫停"
    resume: "▶️  繼續"
    stop: "⏹️  停止"
    alerts: "🚨 警報"
    history: "📜 歷史"

display:
  # 顯示格式配置
  separator: "─"
  max_width: 40
  
  # 進度條配置
  progress_bar:
    length: 10
    filled: "█"
    empty: "░"
  
  # 狀態圖示
  status_icons:
    running: "🟢"
    pending: "🟡"
    paused: "🟠"
    completed: "✅"
    failed: "🔴"
    stopped: "⚪"

logging:
  # 日誌配置
  level: "INFO"
  file: "logs/monitoring_dashboard.log"
  max_size_mb: 10
  backup_count: 5